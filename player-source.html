    function restore(state){if(state?.privateContent?.writer===writer)return;if([7,8,9].includes(state?.privateContent?.version)&&Number.isFinite(state.privateContent.time)){let restoredTime=state.privateContent.time;if(state.privateContent.version<9){const m=data.revisionTimeMap;if(restoredTime>=m.oldEnd)restoredTime+=m.delta;else if(restoredTime>=m.start)restoredTime=m.start+(restoredTime-m.start)*m.newDuration/m.oldDuration;}time=Math.max(0,Math.min(total,restoredTime));mapOnly=!!state.privateContent.mapOnly;showCompletedIcons=state.privateContent.showCompletedIcons===true;syncCompletedIconControl();historyOverview=!!state.privateContent.historyOverview;historySelection=(state.privateContent.historySelection||[]).filter(id=>completedRecords().some(r=>r.id===id));historyRecordId=historySelection.includes(state.privateContent.historyRecordId)?state.privateContent.historyRecordId:null;review.hidden=!historyRecordId;historySelect.replaceChildren();for(const id of historySelection){const r=data.historyRecords.find(r=>r.id===id),o=document.createElement('option');o.value=id;o.textContent=r.label+'｜'+data.scenes[r.sceneIndex].ref;historySelect.append(o);}historySelect.value=historyRecordId||'';mapButton.textContent=mapOnly?"返回行程":"已完成地圖";mapButton.setAttribute("aria-pressed",String(mapOnly));root.querySelector('#aj-outline-nav').hidden=!state.privateContent.outlineOpen;root.querySelector('#aj-outline-toggle').setAttribute('aria-expanded',String(!!state.privateContent.outlineOpen));playing=false;cancelAnimationFrame(frame);render();}}
    const outlineButtons=new Map();
    function outlineTree(nodes,parent){for(const n of nodes){const li=document.createElement('li'),row=document.createElement('div');row.className='aj-outline-item';if(n.children.length){const label=document.createElement('span');label.textContent=n.code+' '+n.label;row.append(label);}else{const button=document.createElement('button');button.type='button';button.className='btn';button.textContent=n.code+' '+n.label;button.addEventListener('click',()=>{jumpTo(data.scenes.find(s=>s.outlineId===n.id).id);root.querySelector('.aj-map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});});row.append(button);outlineButtons.set(n.id,button);}const link=document.createElement('a');link.className='text-small';link.textContent='創'+n.range;link.href=n.url;link.target='_blank';link.rel='noopener noreferrer';row.append(link);li.append(row);if(n.children.length){const ul=document.createElement('ul');ul.className='aj-outline-tree';outlineTree(n.children,ul);li.append(ul);}parent.append(li);}}
    outlineTree(data.outline,root.querySelector('#aj-outline-list'));
    root.querySelector('#aj-outline-toggle').addEventListener('click',()=>{const nav=root.querySelector('#aj-outline-nav'),button=root.querySelector('#aj-outline-toggle');nav.hidden=!nav.hidden;button.setAttribute('aria-expanded',String(!nav.hidden));save();});
    restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
    new ResizeObserver(resize).observe(svg);document.fonts?.ready.then(resize);resize();
  })();
  </script>
